#
# The grading load (new-bounty SKILL.md section 5's gate), at the expected field (2,000, the budget's: the release's
# first X counts launch has 950 submissions a day before its deadline, and with one entry an account here submissions
# are entrants; gta6-meme-x-01's 7,914, the largest X post field graded, came at up to 10 an account) and 10 times it
# (20,000). Every path is
# gta6-clipper-x-01's, proven on the e2e rig at 2,000 and 20,000 entries (its header's rig proof, 2026-11-20, commit
# 50d3deee4f) and run on production since by the release's X launches: no new harness path, no new kind, no larger
# field, so no rig run is owed. Per-entry events: a submission writes one entry; the entry-link stage reads its own
