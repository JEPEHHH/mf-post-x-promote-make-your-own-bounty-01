#
# The rules quote today's Transcript gate lines (server/entries/policy.ts thinkingPolicyLines for program/v1 at
# authorship 12, thinking_committed's line after thinking_in_window's, thinking_own_work's last: social-post.ts
# transcriptGateSection's shape), the eligibility paragraph word for word, the house-holds sentence and the repository
# line. The Transcripts section carries no "They are never published, ..." sentence. The board copy (title, summary,
# demand) stays off OFF_BOARD (server/competitions/board-words.ts). What is public is the post's link, its text and its
