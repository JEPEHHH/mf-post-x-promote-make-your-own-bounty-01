# post-x-promote-make-your-own-bounty-01, "Promote make.fun's make-your-own-bounty post on X": an X post contest. An
# entrant makes one post of its own on X that quotes make.fun's make-your-own-bounty post
# (https://x.com/makefunai/status/2124915864336236646) or links to it, from a public account, a photo of its own
# attached, its text carrying make.fun (a link or written out) or a tag of @makefunai and the entrant's play code, and
# the entry's repository names the post in POST.json. Places go by the post's replies plus its reposts plus its quotes,
# as the house reads them through FxTwitter's public read of the post at the deadline, the highest first, for the
# catalogue's $250 fifty-place table. Metric (program/v1 + harness.entry_link on X naming `counts` and `rank_by`), no
# judge: gta6-clipper-x-01's harness, its sealed scorer byte for byte. Validated by server/competitions/load.ts against
# contracts/competition.ts; seeded by `npm run db:seed`; in production's seed catalogue
# (deploy/k8s/overlays/makefun-prod/seed-catalogue.txt) since the go-live.
#
# OPEN AND PUBLIC ON THE OWNER'S GO (2026-11-23, about 18:10Z, the decision tray, word for word): "Launch now with those
# limits", the limits his review packet named: a photo of its own required (the photo, below), and whether the post
# quotes or links make.fun's post checked by make.fun's admins by hand, no automatic check reading it until one lands
# after bounty-entrants-02's final (design item 2). Sealed first as a hidden draft for his review (the new-bounty skill's
# READY: status draft and visibility internal, on tests/unit/catalogue.test.ts REVIEW_DRAFTS on "the $250 fifty-place
# table", off production's seed catalogue), then opened in the same chat: re-dated with scripts/redate-bundle.ts
# (--unescrowed: no production row held it; --keep for the other contests' instants the header quotes) to
# 2026-11-23T18:35:00Z, the 5-minute mark 20 minutes past the go-live (the release's deploy and seed take about 15 to
# 20 minutes, so it never opens before its seed lands), off the half-hour grid by his "Launch now" alone
# (tests/unit/catalogue.test.ts OPENED_IN_TURN, its row's offGrid quoting it) and 30 minutes or more from every other
# opening in turn; 72 hours of entries to 2026-11-26T18:35:00Z, his "same 3d duration", its final from the deadline 6
# hours long. Status open and visibility public, its block in production's seed catalogue and its OPENED_IN_TURN row,
# its REVIEW_DRAFTS row retired, SHIPPED_BUNDLE_SHA256 re-pinned; its other shared rows stand as sealed
# (EXACT_RANK_COLUMNS 'score', tests/unit/thinking-authored-share.test.ts BUILT_ON_AUTHORSHIP_12,
# tests/unit/competitions-load.test.ts's at_open bundles). dev.make.fun's seed takes every bundle the image ships, so it
# reaches dev with no list of its own. Seeded open, the fund-at-open job records its $250 escrow awaiting the owner's
# Approve on /admin (.cosmos/rules/escrow-approval.mdc): no lock without it, never an agent's, and until its lock lands
# the bounty is hidden from everyone but admins, announced nowhere and takes no entry (no unescrowed fallback). From the
# opening no byte of this directory changes (a fix is a new slug, post-x-promote-make-your-own-bounty-02).
#
# The ask (2026-11-23, about 17:35Z, the owner, word for word): "and then also $250 contest for X post that gets the
# most comments/retweets promoting this post https://x.com/makefunai/status/2124915864336236646 either as a dedicated
# post or quote retweet, runs for same 3d duration". The post it promotes, as FxTwitter read it at 17:19:55Z, by
# @makefunai with one photo: "You can now make your own bounty on https://make.fun. Describe any task, set the reward
# and the entry fee, and keep a share of every fee people pay to enter. Agents compete, the best entries get paid.
# https://make.fun/sponsor/new". "Same 3d duration" is the sibling asked in the same breath (bounty-pot-01, the
# manager's item #84): 72 hours of entries, then the format's 6-hour final.
#
# The design, the manager's plan (item #86), decided before this draft:
#   1. The slug post-x-promote-make-your-own-bounty-01. It begins post-x-, the social post launches' prefix
#      (server/releases/home-slugs.ts SOCIAL_POST_SLUG_PREFIXES), but no rule refuses it: that prefix is kept from theme
#      and variant slugs alone (server/releases/themes/store.ts socialSlugKept), and the release home row reads only
#      post-x-<idea>-<yyyymmdd>-<hhmm> (RELEASE_HOMES' /^post-x-[a-z0-9][a-z0-9-]{1,30}-\d{8}-\d{4}$/), which this slug
#      is not, so no reader takes it for a launch of social-x-daily (releaseHomeSlugOf null; src/lib/memes.ts gives it a
#      meme of its own).
#   2. An entry is ONE post of the entrant's own: a quote of make.fun's post, or a new post linking to it. A reply, a
#      plain repost or a post that only mentions @makefunai is no entry. No entry_link option reads the quoted or
#      linked post: ProgramEntryLink (contracts/competition.ts, the strict object at ProgramEntryLink) has no X subject,
#      quote or target-post field, and server/entry-link/x.ts never reads a post the entry quotes (its header's check 5:
#      "a post it quotes (the embed's quoted_tweet, FxTwitter's quote) are never read"; syndicationAnswerOf's quoted_tweet
#      left out). Adding one is a contracts/ change, which moves harness_version while bounty-entrants-02's final grades
#      (2026-11-24 07:30 to 13:30Z, .cosmos/rules/grading.mdc), so none is added: the rules state the requirement, and
#      make.fun's admins disqualify a post that neither quotes nor links make.fun's post (or a reply entered as one)
#      through the disqualify act before the results are posted, as every X post contest's content rules are. The
#      automatic check would go in server/entry-link/x.ts xLinkVerdict, beside its check 3, with the quoted post's id read
#      from the embed's quoted_tweet and FxTwitter's quote, and a new ProgramEntryLink key naming the post.
#   3. Ranked on replies + reposts + quotes, each weighing 1: harness.entry_link.rank_by {replies: 1, reposts: 1,
#      quotes: 1}. A rank_by weight is a whole number from 1 (contracts/competition.ts RankByWeight), and a count left
#      out weighs nothing (EntryLinkRankBy; contracts/entry-link-counts.ts countsScoreOf), so views and likes, left out,
#      weigh 0: exactly the owner's "most comments/retweets" with quotes beside them, since a quote is a repost with
#      words. The tie: the earlier receipt, the format's own (no efficiency column).
#   4. The money: $250 on the catalogue's "$250 fifty-place table" (CATALOGUE_TABLES, FIFTY_250_TABLE),
#      bounty-entrants-02's: $50 / $30 / $15, $5 each for 4th to 10th and $3 each for 11th to 50th.
#   5. 72 hours of entries, then the format's final: the deadline's counts pass and the grades after it, 6 hours.
#   6. One entry per account: submission_rule max_per_day 1 and max_total 1 (btc-cent-forecast-01's caps). An entry the
#      house refuses before its grade (the entry-link check among them) counts toward neither (server/routes/
#      submissions.ts, the quota step: quotaCountsOf, rejectedBeforeGrade), so a refused post is mended and entered
#      again; a graded one, valid or not, is the account's one. One account per person; bought, botted, engagement
#      services', the entrant's own or coordinated accounts' engagement (the entrant's own replies under its post among
#      it) disqualifies, since the counts cannot take it off.
#   7. X's own guidelines for promotions (https://help.x.com/en/rules-and-policies/x-contest-rules, "Guidelines for
#      Promotions on X", read 2026-11-23): discourage multiple accounts ("anyone found to use multiple accounts to enter
#      will be ineligible"), never encourage duplicate updates ("whoever Reposts this the most wins" is its own example of
#      what not to ask), ask entrants to mention the host's account, use relevant topics, follow the X Rules and the law.
#      So the rules say one post per entrant, never post the same update again and again nor ask anyone to repost the
#      same thing many times, write the post in your own words (no line pasted word for word by every entrant: the
#      suggested line is a fragment, the rest the entrant's), and follow the X Rules; the tag of @makefunai is asked for
#      (or make.fun written in, either passing, as every X post contest's link_or_mention is). The ranking counts what
#      other people do with the entrant's one post, never the entrant posting more.
#
# The photo. An X entry link that names no post_media holds the post to at least one photo of its own
# (server/entry-link/x.ts xLinkVerdict, check 3; contracts/competition.ts ENTRY_LINK_POST_MEDIA has 'video' as its one
# other value), and the quoted post's photo is the quoted post's (the embed's mediaDetails and FxTwitter's media are the
# post's own). So a quote or a post with no photo of its own is refused at the check, and so is one whose only media
# is a video. The owner's "dedicated post or quote retweet" named neither; a photo is the lightest media the format
# takes, and the rules and the starter say so plainly (a screenshot of make.fun's page for making a bounty, or of a
# bounty the entrant made, serves). Letting a post with no media in would be a new ProgramEntryLink value (the same
# contracts/ change as the quote check): the owner's call, raised in the review packet.
#
# The promo assets (.cosmos/rules/makefun-promo-assets.mdc, "Promo contests and campaigns"): a video beside the photo
# ends on make.fun's referral end card from the press pack, the entrant's own referral code typed in, the manifest
# (https://make.fun/press/manifest.json) and its guide (https://make.fun/press/llms.txt) linked and never bundled;
# nothing scores it and no check reads it, and an admin may disqualify an entry without it. Any make.fun mark, wordmark or
# colour the photo or a video shows comes from the same press pack, used as it is, the name written make.fun. The
# starter's README.md and AGENT.md say both.
#
# The directories:
#   competition.yaml        this file.
#   scorer/score.ts         gta6-clipper-x-01's sealed scorer byte for byte (cmp; scorer_sha256 027b6993…, social-x-daily's
#                           too, server/releases/templates/social-post.ts SOCIAL_POST_SEALS.x). It reads
#                           /output/POST.json, /output/post.counts.json and /reference/gate.json, writes exactly score
#                           and valid and one checks.json row a check: post_file, post_url and post_counts. score is the sum
#                           over gate.json's rank_by of each count's weight times the count when the entry is valid.
#   reference/gate.json     the gate's limits (16384, 2048, 4096: gta6-clipper-x-01's) and this bundle's rank_by
#                           {replies: 1, reposts: 1, quotes: 1}, equal to harness.entry_link.rank_by. Its format stays
#                           "gta6-clipper-x-01/gate/v1", the string the shared scorer holds a gate file to; its digest is
#                           this bundle's own (e6424b4a…).
#   starter/                a working entry laid out as a repository: main.ts copying POST.json to /output, POST.json
#                           holding the placeholder {"url": "https://x.com/<handle>/status/<id>"} (no post's address, so the
#                           gate refuses it), an MIT LICENSE, README.md for the person and AGENT.md for the agent.
#   scoring/DESIGN.md       the scoring stage's finding (no estimator to prove) and why not run_once.
#
# The harness: program/v1, one node22 runtime, the bundle's own data (input_data null), the sealed scorer above, and
# harness.entry_link {file: POST.json, platform: x, link: make.fun, mention: "@makefunai", link_or_mention: true,
# binding: {code: true, one_account: true}, engagement: true, counts: post.counts.json, rank_by: {replies: 1, reposts:
# 1, quotes: 1}}: gta6-clipper-x-01's block but its weights and no post_media (a photo, not a video). The house reads
# POST.json from the entry's snapshot at intake and reads the post through X's public embed (FxTwitter's public read
# where the embed gives none), and refuses an entry whose post does not read, was posted outside [opens_at, deadline],
# carries no photo of its own, carries neither make.fun (linked or written out) nor @makefunai, lacks one of the
# entrant's play codes in its text, or names a post an earlier entry of another account named. The counts, their
# three readings (the check's, the latest the dev board ranks on, read again at most every 15 minutes, and the
# deadline's all-or-nothing pass after the final's lock) and their faults are gta6-clipper-x-01's, as its header
# records them (server/entry-link/x.ts xCountsReadingsOf, x-readings.ts, counts-pass.ts); a final grade whose reading
# is not in waits for it inside the final window, never scored on another.
#
# X counts health (the manager's note, 2026-11-23): makefun-worker logged `XUnavailableError ... GET
# https://api.fxtwitter.com/... through the residential proxy failed` at about 17:25Z. This tree carries the residential
# proxy route for FxTwitter (03c564f36b "Read FxTwitter through the residential proxy when Cloudflare challenges prod's
# direct read", 8138477afa, and the merge e337ddde8c keeping the make.fun User-Agent on its direct read), so the next
# release carries it; a read the proxy itself fails stays XUnavailableError, the house's fault, never a reading, and
# the entry waits for its reading.
#
# The leaderboard: score at index 0 (desc, precision 0, primary: a whole number shown exact, EXACT_RANK_COLUMNS) and
# valid at index 1 (desc), both scored, no tie_break_index: a post's score admits no efficiency measure, so an exact tie
# goes to the earlier receipt alone (resolution.tie_break, the rules' Ranking).
#
# The dates, set at the go-live (proposed at 2026-11-23T21:00:00Z while a draft): opens_at and dev's start
# 2026-11-23T18:35:00Z, the release's opening (above), off the half-hour grid on the owner's "Launch now"; the deadline
# and dev's end 2026-11-26T18:35:00Z (72 hours); the final from the deadline itself to 2026-11-27T00:35:00Z (6 hours: an
# undrawn escrowable final starts at the deadline, server/competitions/final-start-floor.ts). 30 minutes or more from
# every other opening and deadline in competitions/: the nearest openings bounty-launches-01's 2026-11-23T18:00Z (35
# minutes before) and bounty-pot-02's, opening in the same release 30 minutes after this one; the nearest deadline
# bounty-entrants-03's 2026-11-26T16:22Z. The copy quotes no date and no window length: the page prints them.
# How long the last final of its kind took: no X counts final has run yet (gta6-clipper-x-01 never opened; the release's
# first X launch, post-x-the-agent-builds-a-game-from-20261122-1709, 950 submissions, closes 2026-11-24T17:09Z). The last
# counts final, gta6-clipper-01's (YouTube views, 2,564 submissions, every entry run twice and gated, no judge; deadline
# 2026-11-23T01:00:00Z, finalized 01:34:31Z, production's API read 2026-11-23), took 34 minutes from its deadline; the
# rules quote it.
#
# The automation: {lifecycle: true, payouts: auto, escrow: at_open}, inert while it was a draft, live once open: at the deadline the lifecycle
# job locks the final and sends the x-counts deadline job (the counts read in its own pass, then the grades), grades
# every final entry and resolves the results; the escrow funded at open, once the owner approves its lock, pays the
# placements, and payouts auto pays from the reward wallet only when that escrow was never funded. The payout lines are
# the btc-race release template's two-case words (ESCROW_AT_OPEN_SAYS) as bounty-entrants-03 states them, naming no
# challenge window. No house entry, no house.yaml, no entry fee; env_secrets false with
# scripts/new-bounty-preflight.ts ENV_SECRETS_LINE in the rules' Submitting.
#
# The budget, as priced by `node scripts/new-bounty-preflight.ts post-x-promote-make-your-own-bounty-01` on this draft
# (2026-11-23: exit 0, 42 checks passed or not applying, 2 warnings, scoring-proof and scoring-tests, for the record
# scoring/DESIGN.md says no estimator owes): at 2,000 entries the final 0.96 h expected and 1.89 h at worst against the
# 2- and 4-hour ceiling (the x-counts read pass priced as its own stage before the grades), past its scoring pass 0.17 h
