# FxTwitter GETs at 2,000 entries, about 2 minutes at the pacer), the x-counts latest job (one a 15-minute slot,
# X_LATEST_PASS_MAX a pass) and the sweep's bounded read. The pods: the split layout, 3 a grade one after the other (2
