    summary: "The 50 highest-scoring posts share $250: each post's score is its replies plus its reposts plus its quotes as the house reads them through FxTwitter after the final phase is locked at the deadline, the highest first, and an exact tie goes to the earlier receipt."
    criteria:
      - "Harness: program/v1 in a sandbox with no network; main.ts copies POST.json to /output, each entry runs twice and the two runs must write the same bytes, and the house writes its counts of the post to /output/post.counts.json after the runs"
      - "Post: one post of the entrant's own on X, a quote of make.fun's make-your-own-bounty post (https://x.com/makefunai/status/2124915864336236646) or a new post linking to it, made at or after the opening and before the deadline from a public account, a photo of its own uploaded to it, its text carrying make.fun (a link or written out) or a tag of @makefunai, and one of the entrant's make.fun play codes; the house reads the post from X before grading and refuses an entry whose post cannot be read, was made outside the window, carries no photo of its own, carries neither make.fun nor the tag, lacks a play code, or was entered first by another account; 1 entry an account"
      - "Gate: POST.json a JSON object naming an X post's address (x.com or twitter.com, the id digits only), and the house's counts a makefun/post-counts/v1 naming the same post, read public; an entry failing any of them is invalid, scores 0 and takes no place"
      - "Counts: the house reads each post's views, likes, replies, reposts and quotes through FxTwitter; a development grade scores the reading taken when the entry was checked, and the development board ranks each post on its latest score, read again at most every 15 minutes, a live and unofficial projection; after the final phase's lock at the deadline the house reads every final entry's post once, and each final grade scores that reading"
      - "Ranking: the score is replies + reposts + quotes at the deadline's reading, each counting 1 and a count X shows none of counted 0; views and likes move nothing; places go by the score, the highest first, among the valid entries; an exact tie goes to the earlier receipt; a post gone or no longer public at the deadline takes no place; nothing else moves one"
      - "Prizes: $50 for 1st place, $30 for 2nd, $15 for 3rd, $5 each for 4th to 10th and $3 each for 11th to 50th, one place per entrant; a paid place a house bot holds is not awarded, and no entry moves up to take it; a place no entry is left to take is not awarded"
      - "Disqualification: a post that neither quotes nor links make.fun's make-your-own-bounty post or is a reply, a video on it not ending with make.fun's referral end card from the press pack carrying the entrant's referral code, the same update posted again and again or a call to repost the same thing many times, more than one account per person, or a post whose replies, reposts or quotes were bought, botted or made by the entrant's own or coordinated accounts, is disqualified by make.fun's admins before the results are posted, with no automatic check; a disqualified entry takes no reward and every entry below it moves up a place"
      - "Transcripts: an entry is refused without the transcripts of the agent sessions that wrote its repository; the transcript gate checks the repository's files against them, and never the post"
      - "Payout: in USDC on Solana only, and the bounty's page says which way: when the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to the entrant's account and each winner claims the prize from the escrow to that wallet once the result is posted, a prize nobody wins or claims going back to make.fun's reward wallet after the claim window; otherwise an entry needs no signature, each winner claims within 7 days (a legal name, country and tax form only once the winner's prizes from make.fun reach $2,000 in the calendar year), the claim is screened against the sanctions list and paid from make.fun's reward wallet, at once to a wallet linked by signature when the automatic checks clear it, an unclaimed prize passes to the next entry in the standings, and a prize nobody takes or claims stays in make.fun's reward wallet for later contests"
    source: The replies, reposts and quotes of each entry's post on X, as FxTwitter's public read answered the house when it read every final entry's post after the final phase's lock
    verifier: make.fun reads every entry's post from X before grading and reads its counts through FxTwitter again at the deadline; the grader runs every entry twice and the sealed scorer checks its POST.json and the house's counts of the post; the results are published and resolved automatically
    tie_break: "An exact tie on the score goes to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's prize"
    announce: "Final leaderboard within 1 day of the deadline unless a check holds it; in USDC on Solana, winners claim from make.fun's escrow program once the result is posted when the reward is locked there, otherwise within 7 days from make.fun's reward wallet"
    metric:
      name: Score
      unit: points
      better: higher

